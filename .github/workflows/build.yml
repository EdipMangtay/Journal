name: Build and Verify Installers
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build unsigned development installer
        if: "!startsWith(github.ref, 'refs/tags/') || contains(github.ref_name, '-preview.')"
        run: npm run dist:win
      - name: Build and verify signed release
        if: "startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-preview.')"
        env:
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_P12 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if (!$env:WIN_CSC_LINK -or !$env:WIN_CSC_KEY_PASSWORD) { throw 'A trusted Windows signing certificate is required for a stable release.' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
          npx electron-builder --win nsis --x64 --publish never --config.forceCodeSigning=true
          if ($LASTEXITCODE -ne 0) { throw 'Signed installer build failed.' }
          $binaries = @(Get-ChildItem release/win-unpacked -Recurse -File | Where-Object { $_.Extension -in '.exe', '.dll', '.node' })
          $binaries += Get-Item release/Liquidity-Edge-Windows-Setup.exe
          foreach ($file in $binaries) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid' -or !$signature.TimeStamperCertificate) { throw "Invalid or untimestamped signature: $($file.Name)" }
          }
      - name: Install and test the actual Windows package
        shell: pwsh
        run: |
          $installer = Join-Path $PWD 'release/Liquidity-Edge-Windows-Setup.exe'
          $target = Join-Path $env:RUNNER_TEMP 'LiquidityEdgeInstalled'
          $process = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$target" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $app = Join-Path $target 'Liquidity Edge.exe'
          if (!(Test-Path $app)) { throw 'Installed executable was not found.' }
          Get-Process 'Liquidity Edge' -ErrorAction SilentlyContinue | Stop-Process -Force
          $env:JOURNAL_E2E_EXECUTABLE = $app
          npm run test:e2e
          if ($LASTEXITCODE -ne 0) { throw 'Installed application tests failed.' }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText((Join-Path $PWD 'release/SHA256SUMS-Windows.txt'), "$hash  Liquidity-Edge-Windows-Setup.exe`n", [Text.UTF8Encoding]::new($false))
      - name: Verify reinstall and uninstall preserve journal data
        shell: pwsh
        run: |
          $installer = Join-Path $PWD 'release/Liquidity-Edge-Windows-Setup.exe'
          $target = Join-Path $env:RUNNER_TEMP 'LiquidityEdgeInstalled'
          $data = Join-Path $env:APPDATA 'Liquidity Edge'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $marker = Join-Path $data 'installer-preservation-test.txt'
          Set-Content -Path $marker -Value 'Keep journal data'
          $process = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$target" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Reinstall failed.' }
          Start-Sleep -Seconds 3
          Get-Process 'Liquidity Edge' -ErrorAction SilentlyContinue | ForEach-Object { $_ | Stop-Process -Force; $_.WaitForExit() }
          if (!(Test-Path $marker)) { throw 'Reinstall removed journal data.' }
          $uninstaller = Join-Path $target 'Uninstall Liquidity Edge.exe'
          # NSIS's _?= avoids the asynchronous self-copy bootstrap and fixes the test target.
          $removed = Start-Process -FilePath $uninstaller -ArgumentList '/S', '/currentuser', "_?=$target" -Wait -PassThru
          if ($removed.ExitCode -ne 0) { throw "Uninstall failed: $($removed.ExitCode)" }
          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path (Join-Path $target 'Liquidity Edge.exe')) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          if (!(Test-Path $marker)) { throw 'Uninstall removed journal data.' }
          if (Test-Path (Join-Path $target 'Liquidity Edge.exe')) { throw 'Uninstall did not remove the executable.' }
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer
          path: |
            windows/release/Liquidity-Edge-Windows-Setup.exe
            windows/release/SHA256SUMS-Windows.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-Test-Evidence
          path: windows/test-results/
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - name: Run native tests
        run: xcodebuild -quiet test -project LiquidityEdge.xcodeproj -scheme LiquidityEdge -destination 'platform=macOS' -derivedDataPath build/testing-ci CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO
      - name: Configure trusted Mac release signing
        if: "startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-preview.')"
        env:
          MACOS_CERTIFICATES_P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_APP_IDENTITY: ${{ secrets.MACOS_APP_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash Scripts/configure-ci-signing.sh
      - name: Build universal Mac installers
        env:
          REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-preview.') && '1' || '0' }}
          MACOS_APP_IDENTITY: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-preview.') && secrets.MACOS_APP_IDENTITY || '' }}
          MACOS_INSTALLER_IDENTITY: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-preview.') && secrets.MACOS_INSTALLER_IDENTITY || '' }}
        run: bash Scripts/package-release.sh "$(/usr/bin/plutil -extract version raw -o - ../windows/package.json)"
      - name: Verify installer payload
        run: |
          pkgutil --expand-full release/Liquidity-Edge-macOS-Universal.pkg build/expanded-package
          find build/expanded-package -name 'Liquidity Edge' -type f -exec file {} \;
          hdiutil verify release/Liquidity-Edge-macOS-Universal.dmg
      - name: Install PKG and launch the installed application
        run: |
          sudo installer -pkg release/Liquidity-Edge-macOS-Universal.pkg -target /
          swiftc -parse-as-library Scripts/verify-installed.swift -o build/verify-installed
          build/verify-installed '/Applications/Liquidity Edge.app'
      - name: Verify the DMG application can launch
        run: |
          mkdir -p build/dmg-mounted
          hdiutil attach release/Liquidity-Edge-macOS-Universal.dmg -mountpoint "$PWD/build/dmg-mounted" -nobrowse -readonly
          trap 'hdiutil detach "$PWD/build/dmg-mounted"' EXIT
          ditto 'build/dmg-mounted/Liquidity Edge.app' 'build/dmg-application/Liquidity Edge.app'
          build/verify-installed "$PWD/build/dmg-application/Liquidity Edge.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-Installers
          path: macos/release/*
      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/liquidity-edge-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/liquidity-edge-signing.keychain-db"
          fi
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Windows-Installer
          path: installers
      - uses: actions/download-artifact@v4
        with:
          name: macOS-Installers
          path: installers
      - name: Publish verified installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-preview.* ]]; then
            gh release create "$GITHUB_REF_NAME" installers/* --verify-tag --prerelease --latest=false --title "Liquidity Edge $GITHUB_REF_NAME - unsigned preview" --notes-file RELEASE-NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" installers/* --verify-tag --title "Liquidity Edge $GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md
          fi
